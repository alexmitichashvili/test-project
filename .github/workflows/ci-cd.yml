name: CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Choose target by branch
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TARGET=production" >> $GITHUB_ENV
            echo "PROD=--prod" >> $GITHUB_ENV
          else
            echo "TARGET=preview" >> $GITHUB_ENV
            echo "PROD=" >> $GITHUB_ENV
          fi

      - name: Pull Vercel settings
        run: vercel pull --yes --environment=$TARGET --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build on Vercel
        run: vercel build $PROD --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt $PROD --token=${{ secrets.VERCEL_TOKEN }}
